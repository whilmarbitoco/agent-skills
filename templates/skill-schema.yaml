# Skill Schema — Java 21 LTS Agent Skills
# Canonical schema for every skill in this library.
# All fields are required unless marked [optional].

skill:
  id: ""                    # Unique kebab-case ID, e.g. "virtual-threads"
  domain: ""                # One of the 12 canonical domains
  subdomain: ""             # Granular module within the domain
  level: ""                 # beginner | intermediate | advanced
  version: ""               # Semver of this skill
  stack: []                 # Technologies this skill references
  requires: []              # Skill IDs that should be known first [optional]
  related: []               # Related skill IDs [optional]

metadata:
  title: ""
  purpose: ""               # 1-2 sentence summary
  concepts_covered: []
  version_compatibility:
    java: ""                # e.g. ">= 21"
    maven: ""               # e.g. ">= 3.9" [optional]
    javafx: ""              # e.g. ">= 21" [optional]
    kickstartfx: ""         # e.g. ">= 2024.x" [optional]

references:
  official_docs: []         # Tier 1 URLs
  recommended_reading: []   # Tier 2 URLs [optional]
  books: []                 # Book ISBNs or titles [optional]

content:
  rules: []                 # Best practices, must-follow
  code_conventions: []      # Naming, formatting, structural rules
  examples:                 # Keyed by concept
    - concept: ""
      description: ""
      code: ""
  anti_patterns: []         # What NOT to do, with why
  checklists:               # Actionable verification items
    setup: []
    implementation: []
    review: []

project_guidance:
  simple_pos_mapping: ""    # How this skill applies to the POS project
  kickstartfx_notes: ""     # KickStartFX-specific guidance [optional]

exercises:
  - task: ""
    difficulty: ""          # easy | medium | hard
    verification: ""

agent_guide:
  strict_conventions: []
  forbidden_patterns: []
  preferred_libraries: []
  example_prompts: []       # Ready-to-use prompts for AI agents
  implementation_checklist: []
  architecture_decisions: [] # ADR-lite entries
  code_templates: []        # Copy-paste starter code
